name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # Windows too: the tests touch real paths (temp dirs, home directory, path.join), and
    # the extension is developed on Windows as well.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['24', '26']
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run compile

      - name: Unit tests
        run: npm test

  e2e:
    # Real VS Code (downloaded by @vscode/test-electron) under a virtual display: the packaged
    # extension must activate and register every command and language model tool package.json
    # declares. Kept as its own job so a VS Code download hiccup is visible without hiding the
    # unit-test result above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node 24
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: VS Code smoke tests
        run: xvfb-run -a npm run test:e2e

  # One stable name for branch protection and the release gate: require only `ci-ok` and the
  # matrix above can change (Node versions, OSes) without a required check silently vanishing.
  # `if: always()` makes it fail, not skip, when a job it needs fails or is cancelled.
  ci-ok:
    if: always()
    # Keep this list equal to every other job in this file, or a new job can fail unnoticed.
    needs: [build-and-test, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to have succeeded
        run: |
          echo "build-and-test: ${{ needs.build-and-test.result }}"
          echo "e2e: ${{ needs.e2e.result }}"
          [ "${{ needs.build-and-test.result }}" = "success" ] && [ "${{ needs.e2e.result }}" = "success" ]
