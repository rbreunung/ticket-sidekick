name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # Windows too: the tests touch real paths (temp dirs, home directory, path.join), and
    # the extension is developed on Windows as well.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['24']
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run compile

      - name: Unit tests
        run: npm test

  e2e:
    # Real VS Code (downloaded by @vscode/test-electron) under a virtual display: the packaged
    # extension must activate and register every command and language model tool package.json
    # declares. Kept as its own job so a VS Code download hiccup is visible without hiding the
    # unit-test result above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node 24
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: VS Code smoke tests
        run: xvfb-run -a npm run test:e2e
