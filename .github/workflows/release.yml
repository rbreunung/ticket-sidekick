name: Release

# Manually-triggered release / preview. Pick the version bump (or type an explicit version)
# in the Run-workflow form — the workflow bumps package.json itself. Both channels commit the
# bump back to the branch so the published version line is strictly increasing and a version
# is never reused (the Marketplace forbids re-publishing a version). Preview adds --pre-release.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        type: choice
        default: release
        options:
          - release
          - preview
      bump:
        description: 'Version bump (ignored when "version" is set)'
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      version:
        description: 'Explicit version e.g. 0.4.0 (overrides bump)'
        type: string
        default: ''

permissions:
  contents: write
  checks: read

# Two release runs at once would race for the same version and for the push to the branch.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          # The version bump is pushed with this token. GITHUB_TOKEN cannot bypass a branch ruleset,
          # so once `main` requires `ci-ok`, set RELEASE_PUSH_TOKEN to a fine-grained token of a
          # repository admin (Contents: read and write). Without the secret the push uses GITHUB_TOKEN.
          token: ${{ secrets.RELEASE_PUSH_TOKEN || github.token }}

      # A release must not ship from a commit whose CI is red or missing. Earlier releases ran
      # from a red main. The bump commits this workflow pushes with GITHUB_TOKEN start no CI of
      # their own, so the check looks at the newest commit not authored by github-actions[bot].
      - name: Require green CI on the released commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=""
          for c in $(git rev-list --first-parent HEAD | head -20); do
            if [ "$(git log -1 --format=%ae "$c")" != "41898282+github-actions[bot]@users.noreply.github.com" ]; then SHA="$c"; break; fi
          done
          [ -n "$SHA" ] || { echo "::error::No non-bot commit found in the last 20 commits."; exit 1; }
          RESULT="$(gh api "repos/${{ github.repository }}/commits/${SHA}/check-runs?filter=latest&per_page=100" \
            --jq '[.check_runs[] | select(.name == "ci-ok")] | sort_by(.started_at) | last | if . == null then "not found" else (.conclusion // .status) end')"
          echo "ci-ok on ${SHA}: ${RESULT}"
          if [ "${RESULT}" != "success" ]; then
            echo "::error::CI (ci-ok) is '${RESULT}' on ${SHA}. 'in_progress' or 'queued' means CI is still running; 'not found' means it never ran. Wait for a green CI run on this commit, then release again."
            exit 1
          fi

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run compile

      - name: Unit tests
        run: npm test

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          # Apply the bump to package.json (no commit/tag — the channel steps own that).
          # An explicit "version" input wins over the patch/minor/major choice.
          if [ -n "${{ inputs.version }}" ]; then
            npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version
          else
            npm version "${{ inputs.bump }}" --no-git-tag-version
          fi
          NEW_VERSION="$(node -p "require('./package.json').version")"
          # A version is taken when the Marketplace has it or its tag exists. A run that
          # published but could not record the bump (2026-11-23, 0.9.3) leaves the Marketplace
          # ahead of git, so ask the Marketplace itself. A failed lookup fails the step.
          EXT="$(node -p "const p = require('./package.json'); p.publisher + '.' + p.name")"
          SHOWN="$(npx vsce show "$EXT" --json)"
          PUBLISHED="$(printf '%s' "$SHOWN" | node -e '
            let s = "";
            process.stdin.on("data", d => s += d).on("end", () => {
              for (const v of JSON.parse(s).versions || []) console.log(v.version);
            });
          ')"
          git fetch -q --tags origin
          taken() {
            printf '%s\n' "$PUBLISHED" | grep -qxF "$1" || git rev-parse -q --verify "refs/tags/$1" >/dev/null
          }
          if [ -n "${{ inputs.version }}" ]; then
            # An explicit version is what was asked for: never replace it with another one.
            if taken "$NEW_VERSION"; then
              echo "::error::Version ${NEW_VERSION} is already published or tagged. Choose a different version."
              exit 1
            fi
          else
            # A bump that lands on a taken version skips forward to the next free patch, so a
            # Marketplace ahead of git heals itself. A skipped number is only a gap in the line.
            for skip in $(seq 1 20); do
              taken "$NEW_VERSION" || break
              echo "::warning::Version ${NEW_VERSION} is already published or tagged; using the next patch version."
              npm version patch --no-git-tag-version >/dev/null
              NEW_VERSION="$(node -p "require('./package.json').version")"
            done
            if taken "$NEW_VERSION"; then
              echo "::error::No free version found within 20 patch versions of the bump. Set an explicit version."
              exit 1
            fi
          fi
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $NEW_VERSION"

      - name: Resolve last stable release
        id: laststable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Anchor generated notes to the last stable release so preview tags don't truncate
          # the accumulated changelog. Applied to both channels for consistent behaviour.
          # If no stable release exists yet the output is empty and the flag is omitted below.
          LAST_STABLE="$(gh release list --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          echo "tag=$LAST_STABLE" >> "$GITHUB_OUTPUT"

      - name: Fetch release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          LAST_STABLE="${{ steps.laststable.outputs.tag }}"
          # Captured once, before the .vsix is packaged, so CHANGELOG.md (below) and the
          # GitHub Release (created later in Publish) both trace to this one fetch.
          if [ -n "$LAST_STABLE" ]; then
            gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="${VERSION}" \
              -f target_commitish="$(git rev-parse HEAD)" \
              -f previous_tag_name="${LAST_STABLE}" \
              --jq '.body' > release-notes.md
          else
            gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="${VERSION}" \
              -f target_commitish="$(git rev-parse HEAD)" \
              --jq '.body' > release-notes.md
          fi

      - name: Update CHANGELOG.md
        if: inputs.channel == 'release'
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          DATE="$(date -u +%Y-%m-%d)"
          # Strip GitHub's "by @author in #PR" attribution from each line for the in-editor
          # copy only — the GitHub Release created later keeps release-notes.md unstripped.
          # Stripping goes through scripts/changelogNotes.mjs, the same helper
          # scripts/backfill-changelog.mjs uses, so the two entry sources can't drift.
          {
            printf '## [%s] - %s\n\n' "${VERSION}" "${DATE}"
            node scripts/changelogNotes.mjs strip < release-notes.md
            printf '\n'
            if [ -f CHANGELOG.md ]; then cat CHANGELOG.md; fi
          } > CHANGELOG.md.new
          mv CHANGELOG.md.new CHANGELOG.md

      # Record the version in git before anything is built or published: the bump commit, its
      # tag and the bump on the branch. The .vsix is then built from exactly that tagged commit,
      # and the Marketplace publish (the irreversible step) comes last. If anything here fails,
      # nothing is published yet.
      - name: Commit, tag and push the version
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          BRANCH="${{ github.ref_name }}"
          # Guard: a version is recorded exactly once. If its tag already exists, stop.
          if git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1 \
            || git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag ${VERSION} already exists. Choose a different bump or version."
            exit 1
          fi
          git commit -am "${VERSION}"
          git tag "${VERSION}"
          git push origin "refs/tags/${VERSION}"
          # Bring the bump onto the branch. It may have moved since checkout (2026-11-23: a PR
          # merged 9 seconds before the push). Merge, not rebase, so the tag stays on the source
          # the .vsix is built from; the branch is the first parent, so the green-CI check above
          # (first-parent, bot commits skipped) still finds the newest PR.
          PUSHED=""
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "${BRANCH}"
            git checkout -q --detach FETCH_HEAD
            if git merge --no-ff --no-edit -m "Merge ${VERSION} into ${BRANCH}" "${VERSION}" \
              && git push origin "HEAD:${BRANCH}"; then
              PUSHED="yes"
              break
            fi
            git merge --abort 2>/dev/null || true
            echo "Push of ${VERSION} to ${BRANCH} failed (attempt ${attempt} of 5)."
            sleep $((attempt * 5))
          done
          if [ -z "${PUSHED}" ]; then
            echo "::error::Tag ${VERSION} is pushed, but the bump did not reach ${BRANCH}; nothing was published. Merge tag ${VERSION} into ${BRANCH} by hand, or delete the tag, then release again."
            exit 1
          fi
          # Build from the tagged commit, not from the merge (which may hold newer PRs).
          git checkout -q "refs/tags/${VERSION}"

      - name: Package VSIX
        id: pkg
        run: |
          set -euo pipefail
          VSIX="ticket-sidekick-${{ steps.ver.outputs.version }}.vsix"
          # A pre-release must be marked at PACKAGE time — vsce rejects `publish --pre-release`
          # on a VSIX that wasn't packaged with `--pre-release`. Match the flag to the channel.
          if [ "${{ inputs.channel }}" = "preview" ]; then
            npx vsce package --pre-release --out "$VSIX"
          else
            npx vsce package --out "$VSIX"
          fi
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          # vsce reads the token from VSCE_PAT; it stays out of the command line.
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          VSIX="${{ steps.pkg.outputs.vsix }}"
          # Both channels advance and commit the version so the published version line is
          # strictly increasing — a version (and therefore a Marketplace publish) is never
          # reused. The --pre-release / --prerelease flags distinguish a preview, not the
          # version number.
          VSCE_PRERELEASE=""
          GH_PRERELEASE=""
          TITLE="${VERSION}"
          if [ "${{ inputs.channel }}" = "preview" ]; then
            VSCE_PRERELEASE="--pre-release"
            GH_PRERELEASE="--prerelease"
            TITLE="${VERSION} (preview)"
          fi
          if ! npx vsce publish ${VSCE_PRERELEASE} --packagePath "${VSIX}"; then
            echo "::error::Marketplace publish of ${VERSION} failed. Tag ${VERSION} and the bump on the branch stay; release the next version once the cause is fixed."
            exit 1
          fi
          gh release create "${VERSION}" ${GH_PRERELEASE} \
            --verify-tag \
            --title "${TITLE}" \
            --notes-file release-notes.md \
            "${VSIX}"
