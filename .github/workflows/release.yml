name: Release

# Manually-triggered release / preview. Pick the version bump (or type an explicit version)
# in the Run-workflow form — the workflow bumps package.json itself. Both channels commit the
# bump back to the branch so the published version line is strictly increasing and a version
# is never reused (the Marketplace forbids re-publishing a version). Preview adds --pre-release.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        type: choice
        default: release
        options:
          - release
          - preview
      bump:
        description: 'Version bump (ignored when "version" is set)'
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      version:
        description: 'Explicit version e.g. 0.4.0 (overrides bump)'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run compile

      - name: Unit tests
        run: npm test

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          # Apply the bump to package.json (no commit/tag — the channel steps own that).
          # An explicit "version" input wins over the patch/minor/major choice.
          if [ -n "${{ inputs.version }}" ]; then
            npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version
          else
            npm version "${{ inputs.bump }}" --no-git-tag-version
          fi
          NEW_VERSION="$(node -p "require('./package.json').version")"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $NEW_VERSION"

      - name: Resolve last stable release
        id: laststable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Anchor generated notes to the last stable release so preview tags don't truncate
          # the accumulated changelog. Applied to both channels for consistent behaviour.
          # If no stable release exists yet the output is empty and the flag is omitted below.
          LAST_STABLE="$(gh release list --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          echo "tag=$LAST_STABLE" >> "$GITHUB_OUTPUT"

      - name: Fetch release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          LAST_STABLE="${{ steps.laststable.outputs.tag }}"
          # Captured once, before the .vsix is packaged, so CHANGELOG.md (below) and the
          # GitHub Release (created later in Publish) both trace to this one fetch.
          if [ -n "$LAST_STABLE" ]; then
            gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="${VERSION}" \
              -f target_commitish="$(git rev-parse HEAD)" \
              -f previous_tag_name="${LAST_STABLE}" \
              --jq '.body' > release-notes.md
          else
            gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="${VERSION}" \
              -f target_commitish="$(git rev-parse HEAD)" \
              --jq '.body' > release-notes.md
          fi

      - name: Update CHANGELOG.md
        if: inputs.channel == 'release'
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          DATE="$(date -u +%Y-%m-%d)"
          # Strip GitHub's "by @author in #PR" attribution from each line for the in-editor
          # copy only — the GitHub Release created later keeps release-notes.md unstripped.
          # Stripping goes through scripts/changelogNotes.mjs, the same helper
          # scripts/backfill-changelog.mjs uses, so the two entry sources can't drift.
          {
            printf '## [%s] - %s\n\n' "${VERSION}" "${DATE}"
            node scripts/changelogNotes.mjs strip < release-notes.md
            printf '\n'
            if [ -f CHANGELOG.md ]; then cat CHANGELOG.md; fi
          } > CHANGELOG.md.new
          mv CHANGELOG.md.new CHANGELOG.md

      - name: Package VSIX
        id: pkg
        run: |
          set -euo pipefail
          VSIX="ticket-sidekick-${{ steps.ver.outputs.version }}.vsix"
          # A pre-release must be marked at PACKAGE time — vsce rejects `publish --pre-release`
          # on a VSIX that wasn't packaged with `--pre-release`. Match the flag to the channel.
          if [ "${{ inputs.channel }}" = "preview" ]; then
            npx vsce package --pre-release --out "$VSIX"
          else
            npx vsce package --out "$VSIX"
          fi
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          VSIX="${{ steps.pkg.outputs.vsix }}"
          # Both channels advance and commit the version so the published version line is
          # strictly increasing — a version (and therefore a Marketplace publish) is never
          # reused. The --pre-release / --prerelease flags distinguish a preview, not the
          # version number.
          VSCE_PRERELEASE=""
          GH_PRERELEASE=""
          TITLE="${VERSION}"
          if [ "${{ inputs.channel }}" = "preview" ]; then
            VSCE_PRERELEASE="--pre-release"
            GH_PRERELEASE="--prerelease"
            TITLE="${VERSION} (preview)"
          fi
          # Guard: a version is published exactly once. If its tag/release already exists, stop.
          if git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1 || gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "::error::Version ${VERSION} already exists. Choose a different bump or version."
            exit 1
          fi
          # Marketplace first (the irreversible step). Only once it succeeds do we record the
          # bump in the repo and create the GitHub release + bare tag at that commit.
          npx vsce publish ${VSCE_PRERELEASE} --packagePath "${VSIX}" --pat "${VSCE_PAT}"
          git commit -am "${VERSION}"
          git push origin "HEAD:${{ github.ref_name }}"
          gh release create "${VERSION}" ${GH_PRERELEASE} \
            --target "$(git rev-parse HEAD)" \
            --title "${TITLE}" \
            --notes-file release-notes.md \
            "${VSIX}"
