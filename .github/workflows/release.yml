name: Release

# Manually-triggered release / preview. Pick the version bump (or type an explicit version)
# in the Run-workflow form — the workflow bumps package.json itself. For a release it commits
# the bump back to the branch; a preview bump is ephemeral (build-only, not committed).
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        type: choice
        default: release
        options:
          - release
          - preview
      bump:
        description: 'Version bump (ignored when "version" is set)'
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      version:
        description: 'Explicit version e.g. 0.4.0 (overrides bump)'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run compile

      - name: Unit tests
        run: npm test

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          # Apply the bump to package.json (no commit/tag — the channel steps own that).
          # An explicit "version" input wins over the patch/minor/major choice.
          if [ -n "${{ inputs.version }}" ]; then
            npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version
          else
            npm version "${{ inputs.bump }}" --no-git-tag-version
          fi
          NEW_VERSION="$(node -p "require('./package.json').version")"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $NEW_VERSION"

      - name: Package VSIX
        id: pkg
        run: |
          set -euo pipefail
          VSIX="ticket-sidekick-${{ steps.ver.outputs.version }}.vsix"
          # A pre-release must be marked at PACKAGE time — vsce rejects `publish --pre-release`
          # on a VSIX that wasn't packaged with `--pre-release`. Match the flag to the channel.
          if [ "${{ inputs.channel }}" = "preview" ]; then
            npx vsce package --pre-release --out "$VSIX"
          else
            npx vsce package --out "$VSIX"
          fi
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: ${{ inputs.channel == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          VSIX="${{ steps.pkg.outputs.vsix }}"
          # Guard: never release a version that already shipped — pick a different bump/version.
          if git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1 || gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "::error::Version ${VERSION} is already released. Choose a different bump or version."
            exit 1
          fi
          # Marketplace first (the irreversible step). Only once it succeeds do we record the
          # bump in the repo and create the GitHub release + bare tag at that commit.
          npx vsce publish --packagePath "${VSIX}" --pat "${VSCE_PAT}"
          git commit -am "${VERSION}"
          git push origin "HEAD:${{ github.ref_name }}"
          gh release create "${VERSION}" \
            --target "$(git rev-parse HEAD)" \
            --title "${VERSION}" \
            --generate-notes \
            "${VSIX}"

      - name: Publish preview (pre-release)
        if: ${{ inputs.channel == 'preview' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          VSIX="${{ steps.pkg.outputs.vsix }}"
          # Preview is ephemeral: the bump is built but NOT committed to the repo. Suffix the
          # tag so a preview never collides with the eventual release tag.
          TAG="${VERSION}-preview.${{ github.run_number }}"
          npx vsce publish --pre-release --packagePath "${VSIX}" --pat "${VSCE_PAT}"
          gh release create "${TAG}" \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "${VERSION} (preview)" \
            --generate-notes \
            "${VSIX}"
